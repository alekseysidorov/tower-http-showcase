[workspace]
members = [
  "crates/client",
  "crates/api",
  "crates/server",
  "crates/fractal-core",
  "crates/renderer",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.dependencies]
showcase-api = { path = "crates/api", version = "0.0.0" }
fractal-core = { path = "crates/fractal-core", version = "0.0.0" }

axum = "0.8"
bytes = "1"
eyre = "0.6.12"
png = "0.18"
futures-util = "0.3.31"
headers = "0.4"
http = "1.3.1"
http-body-util = "0.1"
humantime-serde = "1.1.1"
log = { version = "0.4.27", features = ["kv_serde"] }
rand = "0.9"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
structured-logger = "1.0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.2", features = [
  "limit",
  "buffer",
  "discover",
  "balance",
  "retry",
] }
tower-http = { version = "0.7.0", features = [
  "map-request-body",
  "map-response-body",
  "set-header",
  "util",
] }
tower-http-client = "0.6.1"
tower-reqwest = "0.6.1"
context-logger = "0.2.0"
